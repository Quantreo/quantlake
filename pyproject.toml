[tool.poetry]
name = "quantlake"
version = "0.1.0"
description = "Professional trading database: bronze/silver/gold medallion architecture"
authors = ["Quantreo <lucas@quantreo.com>"]
readme = "README.md"
packages = [{include = "quantlake", from = "src"}]

[tool.poetry.dependencies]
python = "~3.13"

# Data manipulation
polars = "^1.20"

# Storage layer
duckdb = "^1.2"
deltalake = "^0.25"

# HTTP & async ingestion
httpx = "^0.27"
websockets = "^13.0"

# Feature pipeline
oryon = "^0.2"

# Credentials
python-dotenv = "^1.0"
pandas = "^3.0.2"
fastapi = "^0.136.0"
uvicorn = {extras = ["standard"], version = "^0.45.0"}
pyarrow = "^24.0.0"
dune-client = "^1.10.0"
pytz = "^2026.1.post1"
scikit-learn = "^1.5"

[tool.poetry.scripts]
dashboard = "quantlake.dashboard.cli:main"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.1"
ipykernel = "^6.29"
pytest = "^8.3"
pytest-asyncio = "^0.24"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
